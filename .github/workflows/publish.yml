name: Créer et publier une vidéo

on:
  schedule:
    # Heures en UTC. 17:00 UTC = 18h à Paris en hiver (19h en été).
    # 00:00 UTC = 1h à Paris en hiver = 19h à New York.
    - cron: "7 17 * * *"
    - cron: "7 0 * * *"
    - cron: "53 19 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier pour de vrai sur TikTok, Instagram et YouTube (sinon simple test)"
        type: boolean
        default: false
      mode:
        description: "Forcer un format (vide = choix automatique)"
        type: choice
        default: ""
        options: ["", rings, multiply, grow, trail, war, reveal, maze, flags, piano, glass, pendulum, bricks, split, overflow, crusher, battle]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
      CHROME_PATH: /usr/bin/google-chrome
      HANDLE: ""
      # Identifiant affiché en fond de vidéo sur chaque plateforme
      HANDLE_TIKTOK: "@subliminal.tv"
      HANDLE_INSTAGRAM: "@subliminal_tv"
      HANDLE_YOUTUBE: "@Subliminal_TVi"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les outils (quelques secondes, gardés en cache)
        run: pip install -q -r requirements.txt

      - name: Créer la vidéo
        run: |
          ARGS=""
          if [ -n "${{ inputs.mode }}" ]; then ARGS="$ARGS --mode ${{ inputs.mode }}"; fi
          if [ "$PUBLISH" != "true" ]; then ARGS="$ARGS --no-state"; fi
          python bot/generate.py $ARGS

      - name: Garder une copie téléchargeable de la vidéo
        uses: actions/upload-artifact@v6
        with:
          name: video
          path: out/
          retention-days: 7

      - name: Héberger la vidéo (branche media)
        if: env.PUBLISH == 'true'
        run: |
          FILE=$(python -c "import json;print(json.load(open('out/post.json'))['file'])")
          FILES=$(python -c "import json;p=json.load(open('out/post.json'));print(' '.join(sorted(set(p.get('files',{}).values())|{p['file']})))")
          git config --global user.name "subliminal-bot"
          git config --global user.email "subliminal-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir -p /tmp/media && cd /tmp/media
          if git clone -q --depth 1 --branch media "$REMOTE" repo 2>/dev/null; then cd repo; else mkdir repo && cd repo && git init -q && git remote add origin "$REMOTE"; fi
          for f in $FILES; do cp "$GITHUB_WORKSPACE/out/$f" .; done
          # On garde seulement les 16 vidéos les plus récentes
          ls -1t *.mp4 | tail -n +17 | xargs -r rm -f
          git checkout -q --orphan fresh
          git add -A && git commit -q -m "media $FILE"
          git push -q -f origin fresh:media
          URL="https://raw.githubusercontent.com/${{ github.repository }}/media/$FILE"
          for i in $(seq 1 30); do
            if curl -sfI "$URL" > /dev/null; then break; fi
            sleep 10
          done
          echo "VIDEO_URL=$URL" >> "$GITHUB_ENV"
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/media/"
          for f in $FILES; do
            for i in $(seq 1 30); do curl -sfI "$BASE$f" > /dev/null && break; sleep 10; done
          done
          URLS=$(python -c "import json,sys;p=json.load(open(sys.argv[2]));print(json.dumps({k:sys.argv[1]+v for k,v in p.get('files',{}).items()}))" "$BASE" "$GITHUB_WORKSPACE/out/post.json")
          echo "VIDEO_URLS=$URLS" >> "$GITHUB_ENV"

      - name: Publier via Buffer
        if: env.PUBLISH == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python bot/publish.py

      - name: Enregistrer l'historique
        if: env.PUBLISH == 'true'
        run: |
          git add state.json ideas.json battles.json
          git commit -q -m "Épisode publié" || exit 0
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
