name: Programmer une vidéo à moi

on:
  # Dépose ta vidéo dans le dossier a_publier/ du dépôt, puis lance ce workflow.
  workflow_dispatch:
    inputs:
      fichier:
        description: "Nom du fichier dans a_publier/ (ex. ma_video.mp4)"
        required: true
      quand:
        description: "Date et heure de Paris, format AAAA-MM-JJ HH:MM (vide = brouillon Buffer)"
        default: ""
      titre:
        description: "Titre (YouTube / TikTok)"
        required: true
      legende:
        description: "Légende (\\n pour un retour à la ligne)"
        required: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  perso:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Préparer la publication
        env:
          FICHIER: ${{ inputs.fichier }}
          QUAND: ${{ inputs.quand }}
          TITRE: ${{ inputs.titre }}
          LEGENDE: ${{ inputs.legende }}
        run: |
          test -f "a_publier/$FICHIER" || { echo "Fichier a_publier/$FICHIER introuvable"; exit 1; }
          mkdir -p out && cp "a_publier/$FICHIER" "out/perso_$FICHIER"
          python - <<'PY'
          import json, os, datetime as dt
          from zoneinfo import ZoneInfo
          f = "perso_" + os.environ["FICHIER"]
          cap = os.environ["LEGENDE"].replace("\\n", "\n")
          json.dump({"file": f, "title": os.environ["TITRE"], "caption": cap}, open("out/post.json", "w"), ensure_ascii=False)
          q = os.environ["QUAND"].strip()
          with open(os.environ["GITHUB_ENV"], "a") as e:
              if q:
                  t = dt.datetime.strptime(q, "%Y-%m-%d %H:%M").replace(tzinfo=ZoneInfo("Europe/Paris"))
                  if t <= dt.datetime.now(dt.timezone.utc):
                      raise SystemExit("L'heure demandée est déjà passée")
                  e.write("DUE_AT=" + t.astimezone(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z") + "\n")
                  e.write("DRAFT=0\n")
              else:
                  e.write("DRAFT=1\n")
          PY

      - name: Héberger la vidéo (branche media)
        run: |
          FILE=$(python -c "import json;print(json.load(open('out/post.json'))['file'])")
          git config --global user.name "subliminal-bot"
          git config --global user.email "subliminal-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir -p /tmp/media && cd /tmp/media
          if git clone -q --depth 1 --branch media "$REMOTE" repo 2>/dev/null; then cd repo; else mkdir repo && cd repo && git init -q && git remote add origin "$REMOTE"; fi
          cp "$GITHUB_WORKSPACE/out/$FILE" .
          ls -1t *.mp4 | tail -n +17 | xargs -r rm -f
          git checkout -q --orphan fresh
          git add -A && git commit -q -m "media $FILE"
          git push -q -f origin fresh:media
          URL="https://raw.githubusercontent.com/${{ github.repository }}/media/$FILE"
          for i in $(seq 1 30); do curl -sfI "$URL" > /dev/null && break; sleep 10; done
          echo "VIDEO_URL=$URL" >> "$GITHUB_ENV"

      - name: Envoyer à Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python bot/publish.py
