<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bounce Studio – prototypes</title>
<style>@font-face{font-family:"Archivo Black";src:url("ArchivoBlack-Regular.ttf") format("truetype");}@font-face{font-family:"Montserrat";src:url("Montserrat.ttf") format("truetype");font-weight:100 900;}</style>
<style>
/*
VOICE: studio de création, sombre et ludique
IDEA: une console de tournage pour shorts verticaux
PICTURE: l'aperçu vidéo 9:16 en direct
COLOUR and TYPE: noir profond, accent bleu électrique, Archivo Black pour la vidéo
LAYOUT: onglets des modes, aperçu, réglages en dessous
*/
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#07070b;color:#eee;font:15px/1.4 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:clip}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;justify-content:center;max-width:660px;width:100%}
button,input,select{background:#1a1a24;color:#eee;border:1px solid #33334a;border-radius:10px;padding:9px 12px;font-size:16px;min-height:44px}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #4d7cff;outline-offset:2px}
.tabs button.active{background:#3a62f0;border-color:#3a62f0}
button.rec{background:#d22;border-color:#d22}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#9a9ab0;flex:1 1 140px}
label.wide{flex:1 1 100%}
canvas{height:min(74vh,165vw);aspect-ratio:9/16;background:#000;border-radius:14px;display:block}
#dl{color:#7cf;margin:4px 0;font-size:16px}
.hint{font-size:12.5px;color:#8a8aa0;text-align:center;padding:2px 14px 18px;max-width:620px}
</style>
</head>
<body>
<div class="bar tabs" id="tabs"></div>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="restart">↻ Rejouer</button>
  <button id="snd">🔊 Son activé</button>
  <button id="rec">⏺ Enregistrer 1 manche</button>
</div>
<a id="dl"></a>
<div class="bar">
  <label class="wide">Accroche (anglais)<input id="hook"></label>
  <label>N° d'épisode<input id="ep" value="1" inputmode="numeric"></label>
  <label>Pseudo affiché<input id="handle" placeholder="@tonpseudo"></label>
  <label>Mot secret (mode Mystery)<input id="secret" value="PIZZA" maxlength="10"></label>
  <label>Instrument<select id="inst">
    <option value="musicbox">Boîte à musique</option><option value="marimba">Marimba</option>
    <option value="glass">Verre / cloches</option><option value="kalimba">Kalimba</option></select></label>
  <label>Mélodie<select id="mel">
    <option value="run">Gamme montante</option><option value="elise">Für Elise</option>
    <option value="ode">Ode à la joie</option><option value="twinkle">Ah ! vous dirai-je</option>
    <option value="canon">Canon de Pachelbel</option></select></label>
</div>
<div class="hint">Touche l'écran une fois pour activer le son (avec réverbération). « Enregistrer 1 manche » relance l'animation et s'arrête tout seul à la fin d'une partie complète. Les mélodies sont des œuvres classiques du domaine public.</div>

<script>
{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1080,H=1920,CX=540,CY=1010,TAU=Math.PI*2;
const FONT='"Montserrat",system-ui,sans-serif';
const $=id=>document.getElementById(id);
const hookIn=$('hook'),epIn=$('ep'),handleIn=$('handle'),secretIn=$('secret'),instSel=$('inst'),melSel=$('mel'),tabs=$('tabs');

/* ---------- Aléatoire (graine reproductible) ---------- */
let seedV=1;
function mulberry(){seedV=seedV+0x6D2B79F5|0;let t=Math.imul(seedV^seedV>>>15,1|seedV);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
let rand=Math.random;
const rnd=(a,b)=>a+rand()*(b-a);
const norm=a=>((a%TAU)+TAU)%TAU;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let simT=0,exporting=false,finished=false,events=[];

/* ---------- Musique ---------- */
const PENTA=[60,62,64,67,69,72,74,76,79,81,84,86,88];
const MEL={
  elise:[76,75,76,75,76,71,74,72,69,60,64,69,71,64,68,71,72,64,76,75,76,75,76,71,74,72,69,60,64,69,71,64,72,71,69],
  ode:[76,76,77,79,79,77,76,74,72,72,74,76,76,74,74,76,76,77,79,79,77,76,74,72,72,74,76,74,72,72],
  twinkle:[72,72,79,79,81,81,79,77,77,76,76,74,74,72,79,79,77,77,76,76,74,79,79,77,77,76,76,74],
  canon:[78,76,74,73,71,69,71,73,74,73,71,69,67,66,67,64]
};
let instName='musicbox',melName='run',soundOn=true,noteI=0;
function nextNote(){const i=noteI++;if(melName==='run'){const L=PENTA.length,p=i%(2*L-2);return PENTA[p<L?p:2*L-2-p];}const m=MEL[melName];return m[i%m.length];}

const INST={
  marimba:[[1,1,.5],[3.99,.32,.09],[9.9,.08,.03]],
  musicbox:[[1,1,1.4],[2,.35,.6],[3,.15,.3],[5.04,.1,.15]],
  glass:[[1,.9,1.8],[2.76,.4,.9],[5.4,.22,.45],[8.93,.12,.2]],
  kalimba:[[1,1,1],[5.9,.3,.1],[11.8,.1,.04]]
};
function impulse(ac,sec){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}return b;}
function makeChain(ac){
  const input=ac.createGain(),comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
  const conv=ac.createConvolver();conv.buffer=impulse(ac,2.4);const wet=ac.createGain();wet.gain.value=.35;
  input.connect(comp);input.connect(conv);conv.connect(wet);wet.connect(comp);
  const noise=ac.createBuffer(1,Math.floor(ac.sampleRate*.6),ac.sampleRate);const nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  return{input,comp,noise};
}
function voice(ac,ch,t,midi,vel,name){
  const f=440*Math.pow(2,(midi-69)/12);
  for(const [r,a,d] of INST[name]||INST.musicbox){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f*r;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a*vel*.15,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ch.input);o.start(t);o.stop(t+d+.05);}
}
function shatter(ac,ch,t,vel){
  const s=ac.createBufferSource();s.buffer=ch.noise;const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=2500;
  const g=ac.createGain();g.gain.setValueAtTime(.45*vel,t);g.gain.exponentialRampToValueAtTime(.0001,t+.45);
  s.connect(hp);hp.connect(g);g.connect(ch.input);s.start(t);s.stop(t+.5);
  for(let i=0;i<7;i++){const o=ac.createOscillator(),gg=ac.createGain(),tt=t+i*.022+Math.random()*.02;o.frequency.value=2500+Math.random()*4500;
    gg.gain.setValueAtTime(0,tt);gg.gain.linearRampToValueAtTime(.07*vel,tt+.002);gg.gain.exponentialRampToValueAtTime(.0001,tt+.15+Math.random()*.4);
    o.connect(gg);gg.connect(ch.input);o.start(tt);o.stop(tt+.7);}
}
function bloop(ac,ch,t,vel){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(1100,t+.07);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22*vel,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g);g.connect(ch.input);o.start(t);o.stop(t+.16);}
function fanfare(ac,ch,t,name){[0,4,7,12,16,19].forEach((s,i)=>voice(ac,ch,t+i*.085,72+s,1,name));}
function synth(ac,ch,t,e){if(e.k==='n')voice(ac,ch,t,e.m,e.v,e.i);else if(e.k==='s')shatter(ac,ch,t,e.v);else if(e.k==='b')bloop(ac,ch,t,e.v);else if(e.k==='f')fanfare(ac,ch,t,e.i);}

let actx=null,live=null,recDest=null;
function initAudio(){
  if(actx){if(actx.state==='suspended')actx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{actx=new AC();live=makeChain(actx);live.comp.connect(actx.destination);recDest=actx.createMediaStreamDestination();live.comp.connect(recDest);}catch(e){actx=null;}
}
document.addEventListener('pointerdown',initAudio);
let lastK={};
function snd(k,v=1,gap=.045){
  if(lastK[k]!==undefined&&simT-lastK[k]<gap)return;lastK[k]=simT;
  const e={k,v,i:instName,t:simT};if(k==='n')e.m=lastNote=nextNote();
  if(exporting){events.push(e);return;}
  if(actx&&soundOn)synth(actx,live,actx.currentTime+.01,e);
}

/* ---------- Particules ---------- */
let parts=[];
function burst(x,y,hue,n=30,sp=900){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(150,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,hue:hue<0?rnd(0,360):hue});}}
function ringBurst(cx,cy,R,hue,n=80){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(100,700);parts.push({x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,hue:hue<0?rnd(0,360):hue});}}
function updParts(dt){for(const p of parts){p.vy+=1300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.1;}parts=parts.filter(p=>p.life>0);}
function drawParts(){for(const p of parts){ctx.fillStyle=`hsla(${p.hue},60%,85%,${p.life*.8})`;ctx.fillRect(p.x-3,p.y-3,6,6);}}

/* ---------- Physique ---------- */
function move(b,dt,g){b.vy+=g*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;}
function reflect(b,cx,cy,R,boost=1){
  const dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,vn=b.vx*nx+b.vy*ny;
  if(vn>0){b.vx-=2*vn*nx;b.vy-=2*vn*ny;b.vx*=boost;b.vy*=boost;}
  b.x=cx+nx*(R-b.r);b.y=cy+ny*(R-b.r);return vn>0;
}
function inGap(b,cx,cy,rot,gap){return norm(Math.atan2(b.y-cy,b.x-cx)-rot)<gap;}
function keepSpeed(b,min,max){const s=Math.hypot(b.vx,b.vy)||1;if(s<min){b.vx*=min/s;b.vy*=min/s;}else if(s>max){b.vx*=max/s;b.vy*=max/s;}}
const imp=b=>clamp(Math.hypot(b.vx,b.vy)/1600,.45,1);
function collide(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;if(d>=m||d===0)return false;
  const nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
  const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv>=0)return false;a.vx+=rv*nx;a.vy+=rv*ny;b.vx-=rv*nx;b.vy-=rv*ny;return true;}
function boxBounce(b,x0,y0,x1,y1){let h=false;
  if(b.x-b.r<x0){b.x=x0+b.r;b.vx=Math.abs(b.vx);h=true;}if(b.x+b.r>x1){b.x=x1-b.r;b.vx=-Math.abs(b.vx);h=true;}
  if(b.y-b.r<y0){b.y=y0+b.r;b.vy=Math.abs(b.vy);h=true;}if(b.y+b.r>y1){b.y=y1-b.r;b.vy=-Math.abs(b.vy);h=true;}return h;}

/* ---------- Dessin ---------- */
function outlined(t,x,y,fill,mw=1000){ctx.save();ctx.shadowColor='rgba(150,120,255,.6)';ctx.shadowBlur=24;ctx.fillStyle=fill;ctx.fillText(t,x,y,mw);ctx.restore();}
function big(t,y,size,fill='#fff'){const w=size>=90?200:(size>=60?300:500);ctx.font=`${w} ${size}px ${FONT}`;ctx.letterSpacing=`${Math.round(size*.12)}px`;ctx.textAlign='center';ctx.textBaseline='middle';outlined(String(t).toUpperCase(),W/2,y,fill);ctx.letterSpacing='0px';}
function glowBall(x,y,r,fill,blur=28){ctx.save();ctx.shadowColor=fill;ctx.shadowBlur=blur;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill();ctx.restore();}
function wrap(t,max){const out=[];let line='';for(const w of t.split(' ')){const test=line?line+' '+w:w;if(ctx.measureText(test).width>max&&line){out.push(line);line=w;}else line=test;}out.push(line);return out;}
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return c;}
const bgGrad=ctx.createRadialGradient(CX,CY,60,CX,CY,1250);bgGrad.addColorStop(0,'#160c2a');bgGrad.addColorStop(.55,'#08050f');bgGrad.addColorStop(1,'#000');
const grain=document.createElement('canvas');grain.width=360;grain.height=640;{const g=grain.getContext('2d'),im=g.createImageData(360,640);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}g.putImageData(im,0,0);}
function drawGrain(){ctx.save();ctx.globalAlpha=.05;ctx.globalCompositeOperation='overlay';ctx.imageSmoothingEnabled=false;const ox=Math.floor(Math.random()*120),oy=Math.floor(Math.random()*120);ctx.drawImage(grain,-ox,-oy,W+240,H+240);ctx.restore();}

/* ---------- Les modes ---------- */
const sims={};

sims.rings={name:'1 · Escape rings',hook:'Can the ball escape all 16 rings before time runs out?',inst:'musicbox',mel:'run',
  init(){this.b={x:CX,y:CY-40,vx:rnd(350,600)*(rand()<.5?-1:1),vy:-300,r:13};this.rings=[];
    for(let i=0;i<16;i++)this.rings.push({r:115+i*25,rot:i*.22,sp:.85+i*.03,gap:.85,hue:i,alive:true});
    this.time=45;this.state='play';this.tr=[];},
  step(dt){const b=this.b;
    if(this.state==='play'){this.time-=dt;if(this.time<=0){this.time=0;this.state='lose';this.end=3;snd('s',1,0);}}
    for(const r of this.rings)r.rot+=r.sp*dt;
    move(b,dt,1400);
    const ring=this.rings.find(r=>r.alive);
    if(ring){const d=Math.hypot(b.x-CX,b.y-CY);
      if(d+b.r>=ring.r){
        if(this.state==='play'&&inGap(b,CX,CY,ring.rot,ring.gap)){if(d-b.r>ring.r){ring.alive=false;ringBurst(CX,CY,ring.r,262);snd('s',.9,0);snd('n',1,0);}}
        else if(reflect(b,CX,CY,ring.r)){snd('n',imp(b));keepSpeed(b,800,1700);}
      }
    }else{
      if(this.state==='play'){this.state='win';this.end=3.5;snd('f',1,0);burst(b.x,b.y,262,120,1300);}
      if(boxBounce(b,0,0,W,H))snd('n',imp(b));
    }
    this.tr.push(b.x,b.y);if(this.tr.length>40)this.tr.splice(0,2);
  },
  draw(){ctx.lineCap='round';
    for(const r of this.rings){if(!r.alive)continue;ctx.beginPath();ctx.arc(CX,CY,r.r,r.rot+r.gap,r.rot+TAU);ctx.lineWidth=4;
      ctx.strokeStyle=`hsla(262,75%,${90-r.hue*2.4}%,${1-r.hue*.035})`;ctx.shadowColor='#8b5cf6';ctx.shadowBlur=18;ctx.stroke();}
    ctx.shadowBlur=0;const tr=this.tr,b=this.b;
    for(let i=0;i<tr.length;i+=2){const k=i/tr.length;ctx.beginPath();ctx.arc(tr[i],tr[i+1],b.r*k,0,TAU);ctx.fillStyle=`rgba(200,180,255,${k*.45})`;ctx.fill();}
    glowBall(b.x,b.y,b.r,'#fff');
    big(this.time.toFixed(2),1640,96,this.time<10?'#f0abfc':'#fff');
    big(`${this.rings.filter(r=>r.alive).length} RINGS LEFT`,1750,44,'rgba(255,255,255,.5)');
    if(this.state==='win')big('ESCAPED!',CY,130,'#ffffff');
    if(this.state==='lose')big("TIME'S UP!",CY,120,'#f0abfc');
  },
  info(){return{state:this.state,left:this.rings.filter(r=>r.alive).length,time:+this.time.toFixed(1)};}
};

sims.multiply={name:'2 · +2 per escape',hook:'Every escape = 2 new balls. Can the ring hold 512?',inst:'marimba',mel:'run',
  nb(){return{x:CX+rnd(-6,6),y:CY+rnd(-6,6),vx:rnd(-600,600),vy:rnd(-700,-100),r:15,hue:rnd(0,360)};},
  init(){this.R=430;this.rot=0;this.gap=.95;this.balls=[this.nb()];this.fall=[];this.cap=512;this.state='play';},
  step(dt){this.rot+=1.1*dt;
    if(this.state==='play'){const keep=[];let add=0;
      for(const b of this.balls){move(b,dt,1100);const d=Math.hypot(b.x-CX,b.y-CY);
        if(d+b.r>=this.R){
          if(inGap(b,CX,CY,this.rot,this.gap)){if(d-b.r>this.R){this.fall.push(b);snd('b',.8,.03);add+=2;continue;}}
          else if(reflect(b,CX,CY,this.R)){snd('n',imp(b)*.8,.07);keepSpeed(b,500,1600);}
        }
        keep.push(b);}
      for(let i=0;i<add&&keep.length<this.cap;i++)keep.push(this.nb());
      this.balls=keep;
      if(this.balls.length>=this.cap){this.state='break';this.end=3.5;snd('s',1,0);snd('f',1,0);ringBurst(CX,CY,this.R,262,220);
        for(const b of this.balls){const a=Math.atan2(b.y-CY,b.x-CX);b.vx=Math.cos(a)*rnd(400,1200);b.vy=Math.sin(a)*rnd(400,1200)-300;this.fall.push(b);}this.balls=[];}
    }
    for(const b of this.fall)move(b,dt,1500);
    this.fall=this.fall.filter(b=>b.y<H+60);
  },
  draw(){
    if(this.state==='play'){ctx.beginPath();ctx.arc(CX,CY,this.R,this.rot+this.gap,this.rot+TAU);ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#fff';ctx.shadowColor='#a78bfa';ctx.shadowBlur=20;ctx.stroke();ctx.shadowBlur=0;}
    for(const b of this.balls.concat(this.fall)){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fillStyle=`hsl(${250+b.hue%50},65%,${68+b.hue%25}%)`;ctx.fill();}
    big(String(this.state==='play'?this.balls.length:this.cap),1640,120);
    big('BALLS',1750,44,'rgba(255,255,255,.5)');
    if(this.state==='break')big('IT BROKE!',CY,130,'#ffffff');
  },
  info(){return{state:this.state,n:this.balls.length};}
};

sims.grow={name:'3 · Grows every bounce',hook:'It grows every bounce. Guess the final count!',inst:'musicbox',mel:'elise',
  init(){this.R=470;this.b={x:CX,y:CY-180,vx:rnd(500,700)*(rand()<.5?-1:1),vy:0,r:20};this.pts=[];this.n=0;this.state='play';},
  step(dt){if(this.state!=='play')return;const b=this.b;move(b,dt,1300);const d=Math.hypot(b.x-CX,b.y-CY);
    if(d+b.r>=this.R&&reflect(b,CX,CY,this.R)){keepSpeed(b,1000,2300);this.pts.push(Math.atan2(b.y-CY,b.x-CX));b.r+=3;this.n++;snd('n',imp(b),.03);
      if(b.r>=this.R-10){this.state='pop';this.end=3.5;burst(CX,CY,262,220,1600);snd('s',1,0);snd('f',1,0);}}},
  draw(){const b=this.b;
    if(this.state==='play'){ctx.lineWidth=1.5;this.pts.forEach((a,i)=>{ctx.beginPath();ctx.moveTo(CX+Math.cos(a)*this.R,CY+Math.sin(a)*this.R);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(215,200,255,${.1+.45*i/this.pts.length})`;ctx.stroke();});}
    ctx.beginPath();ctx.arc(CX,CY,this.R,0,TAU);ctx.lineWidth=4;ctx.strokeStyle='#e4dcff';ctx.shadowColor='#8b5cf6';ctx.shadowBlur=18;ctx.stroke();ctx.shadowBlur=0;
    if(this.state==='play'){glowBall(b.x,b.y,b.r,'#7c3aed',30);ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();}
    big(String(this.n),1640,120);big('BOUNCES',1750,44,'rgba(255,255,255,.5)');
    if(this.state==='pop')big('POP!',CY,150,'#fff');
  },
  info(){return{state:this.state,n:this.n};}
};

sims.trail={name:'4 · Speed tube',hook:'It speeds up every bounce... until it breaks free',inst:'glass',mel:'canon',
  init(){this.R=470;this.b={x:CX+rnd(-150,150),y:CY-220,vx:rnd(-450,450),vy:0,r:62};this.hue=0;this.n=0;this.state='play';this.t=0;
    if(!this.tc){this.tc=mk();this.tx=this.tc.getContext('2d');}this.tx.clearRect(0,0,W,H);},
  step(dt){const b=this.b;this.t+=dt;move(b,dt,1500);
    if(this.state!=='play')return;
    const d=Math.hypot(b.x-CX,b.y-CY);
    if(d+b.r>=this.R&&reflect(b,CX,CY,this.R,1.025)){keepSpeed(b,600,4000);this.n++;this.hue+=27;snd('n',imp(b));

  const nx=ex/d,ny=ey/d;b.x=px+nx*m;b.y=py+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;return -vn;}return 0;}

function load(k,ov={}){curKey=k;cur=sims[k];parts=[];simT=0;noteI=0;lastK={};cur.end=0;
  hookIn.value=ov.hook||cur.hook;instSel.value=instName=ov.inst||cur.inst;melSel.value=melName=ov.mel||cur.mel;cur.init();
  [...tabs.children].forEach(b=>b.classList.toggle('active',b.dataset.k===k));}
function restart(){if(exporting){finished=true;return;}if(rec&&rec.state==='recording'){rec.stop();}load(curKey);}
function tick(dt){simT+=dt;if(cur.end>0){cur.end-=dt;if(cur.end<=0){restart();return;}}cur.step(dt);}
function drawOverlay(){
  const ep=epIn.value.trim().replace(/^#/,'');
  if(ep){ctx.font=`500 32px ${FONT}`;ctx.letterSpacing='10px';ctx.textAlign='center';ctx.textBaseline='middle';const t='Nº '+ep,w=ctx.measureText(t).width+56;
    ctx.strokeStyle='rgba(228,220,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W/2-w/2,132,w,58,29);ctx.stroke();ctx.fillStyle='#e4dcff';ctx.fillText(t,W/2+5,162);ctx.letterSpacing='0px';}
  const h=hookIn.value.trim().toUpperCase();if(h){ctx.font=`500 46px ${FONT}`;ctx.letterSpacing='6px';ctx.textAlign='center';ctx.textBaseline='middle';wrap(h,960).forEach((l,i)=>outlined(l,W/2,270+i*66,'#fff'));ctx.letterSpacing='0px';}
  const hd=handleIn.value.trim();if(hd){ctx.font=`400 30px ${FONT}`;ctx.letterSpacing='5px';ctx.globalAlpha=.45;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(hd,W/2,1855);ctx.globalAlpha=1;ctx.letterSpacing='0px';}
}
function render(){ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);cur.draw();drawParts();drawOverlay();drawGrain();
  if(cur.end>0&&cur.end<.45){ctx.fillStyle=`rgba(0,0,0,${1-cur.end/.45})`;ctx.fillRect(0,0,W,H);}}
function frame(ts){
  if(!exporting){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;for(let i=0;i<8;i++)tick(dt/8);updParts(dt);render();}
  requestAnimationFrame(frame);
}
for(const [k,s] of Object.entries(sims)){const b=document.createElement('button');b.textContent=s.name;b.dataset.k=k;b.onclick=()=>load(k);tabs.appendChild(b);}
load('rings');
(document.fonts&&document.fonts.load?document.fonts.load(`40px "Archivo Black"`):Promise.resolve()).catch(()=>{}).then(()=>requestAnimationFrame(frame));

$('restart').onclick=()=>load(curKey);
const sndBtn=$('snd');sndBtn.onclick=()=>{soundOn=!soundOn;sndBtn.textContent=soundOn?'🔊 Son activé':'🔇 Son coupé';};
instSel.onchange=()=>{instName=instSel.value;};
melSel.onchange=()=>{melName=melSel.value;noteI=0;};
secretIn.onchange=()=>{if(curKey==='reveal')load('reveal');};

/* ---------- Enregistrement ---------- */
const recBtn=$('rec'),dl=$('dl');
let lastBlob=null,lastName='',dlCap=null;
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{dlCap=d;}).catch(()=>{});}catch(e){}
dl.addEventListener('click',async e=>{
  if(!dlCap||!lastBlob)return;e.preventDefault();
  try{await dlCap.save({filename:lastName,data:lastBlob});}
  catch(err){try{await dlCap.save({filename:lastName,data:new Uint8Array(await lastBlob.arrayBuffer())});}catch(e2){dl.textContent='Téléchargement refusé – réessaie';}}
});
recBtn.onclick=()=>{
  initAudio();
  if(rec){rec.stop();return;}
  if(!window.MediaRecorder||!cv.captureStream){dl.textContent="Enregistrement non supporté ici : utilise l'enregistrement d'écran.";return;}
  const tracks=[...cv.captureStream(60).getVideoTracks()];if(recDest)tracks.push(...recDest.stream.getAudioTracks());
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  let r;try{r=new MediaRecorder(new MediaStream(tracks),mime?{mimeType:mime,videoBitsPerSecond:10e6}:{});}catch(e){dl.textContent='Erreur : '+e.message;return;}
  const chunks=[],type=r.mimeType||mime||'video/webm';
  r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  r.onstop=()=>{lastBlob=new Blob(chunks,{type});dl.href=URL.createObjectURL(lastBlob);
    dl.download=lastName=`${curKey}_ep${epIn.value||1}.${type.includes('mp4')?'mp4':'webm'}`;dl.textContent='⬇ Télécharger la vidéo';
    rec=null;recBtn.textContent='⏺ Enregistrer 1 manche';recBtn.classList.remove('rec');};
  load(curKey);r.start(250);rec=r;dl.textContent='';
  recBtn.textContent='⏹ Arrêter';recBtn.classList.add('rec');
};

/* ---------- Export image par image (outil interne) ---------- */
function wavB64(buf){const n=buf.length,ch=buf.numberOfChannels,sr=buf.sampleRate,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*ch*2,true);
  const d=[];for(let c=0;c<ch;c++)d.push(buf.getChannelData(c));let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){v.setInt16(o,clamp(d[c][i],-1,1)*32767,true);o+=2;}
  const u=new Uint8Array(ab);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
window.__exp={
  start(mode,s,o={}){exporting=true;finished=false;events=[];seedV=s;rand=mulberry;if(o.secret)secretIn.value=o.secret;if(o.ep!==undefined)epIn.value=o.ep;if(o.handle!==undefined)handleIn.value=o.handle;load(mode,o);},
  frame(fps){const dt=1/fps;for(let i=0;i<8;i++)tick(dt/8);updParts(dt);render();return{img:cv.toDataURL('image/jpeg',.9),done:finished,t:simT};},
  stats(mode,s,maxT,o={}){this.start(mode,s,o);while(!finished&&simT<maxT){tick(1/240);}const r=cur.info();r.dur=+simT.toFixed(1);r.notes=events.length;return r;},
  async audio(dur){const sr=44100,oc=new OfflineAudioContext(2,Math.ceil(sr*dur),sr),ch=makeChain(oc);ch.comp.connect(oc.destination);
    for(const e of events)if(e.t<dur-.05)synth(oc,ch,e.t,e);
    {const lp=oc.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;const g=oc.createGain();g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(.05,1.5);g.gain.setValueAtTime(.05,Math.max(1.6,dur-1.5));g.gain.linearRampToValueAtTime(0,dur);lp.connect(g);g.connect(ch.input);
     [55,55.4,82.5,110.3].forEach(f=>{const o=oc.createOscillator();o.type='sine';o.frequency.value=f;o.connect(lp);o.start(0);o.stop(dur);});}const buf=await oc.startRendering();return wavB64(buf);}
};
}
